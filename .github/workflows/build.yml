name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create app project
        run: |
          mkdir -p app/www
          NEWEST="$(git log --diff-filter=AM --name-only --format= -- '*.html' | head -1)"
          echo "Using $NEWEST"
          cp "$NEWEST" app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap init "Tide Thai" com.tidethai.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug || (sleep 90 && ./gradlew assembleDebug)
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
