name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create app project
        run: |
          mkdir -p app/www app/assets ~/.android
          NEWEST="$(git log --diff-filter=AM --name-only --format= -- '*.html' | head -1)"
          echo "Using $NEWEST"
          python3 - "$NEWEST" <<'PY'
          import re, sys, base64, os
          h = open(sys.argv[1], encoding='utf8').read()
          for name, data in re.findall(r'<!--ASSET:([\w.-]+):([A-Za-z0-9+/=]+)-->', h):
              path = os.path.expanduser('~/.android/debug.keystore') if name == 'debug.keystore' else 'app/assets/' + name
              open(path, 'wb').write(base64.b64decode(data))
          m = re.search(r'id="appicon" href="data:image/png;base64,([A-Za-z0-9+/=]+)"', h)
          if m:
              open('app/assets/icon-only.png', 'wb').write(base64.b64decode(m.group(1)))
          h = re.sub(r'<!--ASSET:[^>]*-->\n?', '', h)
          open('app/www/index.html', 'w', encoding='utf8').write(h)
          PY
          cd app
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/assets
          npx cap init "เช็คน้ำ เช็คลม" com.tidethai.app --web-dir www
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml || echo "WARNING location permission not added"
          npx @capacitor/assets generate --android || echo "icon step failed, keeping default icon"
          npx cap sync android
      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug || (sleep 90 && ./gradlew assembleDebug)
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
