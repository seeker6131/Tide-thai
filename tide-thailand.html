<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>น้ำขึ้นน้ำลงไทย</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body { margin: 0; padding-bottom: 76px; font-family: sans-serif;
         background: #0b2540; color: white; text-align: center; }
  header { background: #071a2e; padding: 12px 8px; position: sticky; top: 0; z-index: 1000; }
  #place { font-size: 18px; padding: 8px; width: 94%; border-radius: 10px; border: none;
           background: #14406b; color: white; }
  .card { background: #14406b; border-radius: 16px; padding: 16px; margin: 16px; }
  .page { display: none; }
  #temp { font-size: 48px; margin: 8px; }
  #arrow { font-size: 64px; display: inline-block; transition: transform 1s; }
  #map { height: 68vh; }
  .btn { display: inline-block; padding: 8px 16px; margin: 4px; font-size: 18px;
         background: #5ec8ff; color: #071a2e; border: none; border-radius: 10px; }
  #date { display: inline-block; min-width: 170px; font-size: 18px; }
  #cursor { font-size: 28px; color: #ff8080; margin: 10px 0; min-height: 34px; }
  #chartbox { height: 300px; }
  #chart { touch-action: pan-y; }
  #list { font-size: 18px; line-height: 1.6; }
  .small { font-size: 12px; opacity: 0.7; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex;
        background: #071a2e; z-index: 1000; }
  nav button { flex: 1; padding: 18px 0; font-size: 16px;
               background: none; border: none; color: white; }
  nav button.on { color: #5ec8ff; font-weight: bold; }
</style>
</head>
<body>

<header><select id="place" onchange="changePlace()"></select></header>

<div id="tide" class="page">
  <div class="card">
    <div>
      <button class="btn" onclick="moveDay(-1)">◀</button>
      <span id="date"></span>
      <button class="btn" onclick="moveDay(1)">▶</button>
    </div>
    <p id="cursor"></p>
    <div id="chartbox"><canvas id="chart"></canvas></div>
    <p id="list"></p>
    <p class="small">ข้อมูล: มาตราน้ำ พ.ศ.2569 กรมอุทกศาสตร์ กองทัพเรือ<br>
      ความสูงเป็นเมตรเหนือระดับน้ำลงต่ำที่สุด ค่าทุกต้นชั่วโมงมาจากตารางโดยตรง<br>
      ค่าระหว่างชั่วโมงคำนวณเชื่อมจากค่าสองฝั่ง ระดับน้ำจริงอาจต่างตามลมและความกดอากาศ</p>
  </div>
</div>

<div id="weather" class="page">
  <div class="card"><h2>อากาศตอนนี้</h2><p id="temp">...</p></div>
  <div class="card"><h2>ลม</h2><div id="arrow">↑</div><p id="wind"></p></div>
</div>

<div id="radar" class="page">
  <div id="map"></div>
  <p id="time"></p>
</div>

<nav>
  <button id="b-tide" onclick="show('tide')">น้ำ</button>
  <button id="b-weather" onclick="show('weather')">อากาศ</button>
  <button id="b-radar" onclick="show('radar')">เรดาร์</button>
</nav>

const AL = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
const YEAR = 2026;

let station = STATIONS[0];
let tideChart = null, dayOffset = 0, cursorT = null, levelAt = null;
let map = null, marker = null, radarLayer = null, current = "tide";

const sel = document.getElementById("place");
[["gulf", "อ่าวไทย"], ["anda", "ทะเลอันดามัน"]].forEach(g => {
  const og = document.createElement("optgroup");
  og.label = g[1];
  STATIONS.filter(s => s.sea === g[0]).forEach(s => {
    const o = document.createElement("option");
    o.value = s.id; o.textContent = s.th;
    og.appendChild(o);
  });
  sel.appendChild(og);
});
try {
  const saved = localStorage.getItem("station");
  if (saved && STATIONS.some(s => s.id === saved)) sel.value = saved;
} catch (e) {}
station = STATIONS.find(s => s.id === sel.value);

function changePlace() {
  station = STATIONS.find(s => s.id === sel.value);
  try { localStorage.setItem("station", station.id); } catch (e) {}
  loadTide();
  if (current === "weather") loadWeather();
  if (current === "radar") loadRadar();
}

function show(name) {
  current = name;
  document.querySelectorAll(".page").forEach(p => p.style.display = "none");
  document.querySelectorAll("nav button").forEach(b => b.className = "");
  document.getElementById(name).style.display = "block";
  document.getElementById("b-" + name).className = "on";
  if (name === "tide") loadTide();
  if (name === "weather") loadWeather();
  if (name === "radar") loadRadar();
}

function loadWeather() {
  const names = ["เหนือ","ตะวันออกเฉียงเหนือ","ตะวันออก","ตะวันออกเฉียงใต้",
                 "ใต้","ตะวันตกเฉียงใต้","ตะวันตก","ตะวันตกเฉียงเหนือ"];
  document.getElementById("temp").textContent = "...";
  document.getElementById("wind").textContent = "";
  fetch("https://api.open-meteo.com/v1/forecast?latitude=" + station.lat
    + "&longitude=" + station.lon
    + "&current=temperature_2m,wind_speed_10m,wind_direction_10m")
    .then(res => res.json())
    .then(data => {
      const now = data.current;
      const deg = now.wind_direction_10m;
      document.getElementById("temp").textContent = now.temperature_2m + "°C";
      document.getElementById("wind").textContent = "ลมจากทิศ"
        + names[Math.round(deg / 45) % 8] + " " + now.wind_speed_10m + " กม./ชม.";
      document.getElementById("arrow").style.transform =
        "rotate(" + (deg + 180) + "deg)";
    })
    .catch(() => { document.getElementById("temp").textContent = "โหลดไม่ได้"; });
}

function loadRadar() {
  if (!map) {
    map = L.map("map");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      { attribution: "© OpenStreetMap" }).addTo(map);
    marker = L.marker([station.lat, station.lon]).addTo(map);
  }
  map.setView([station.lat, station.lon], 7);
  marker.setLatLng([station.lat, station.lon]);
  map.invalidateSize();
  fetch("https://api.rainviewer.com/public/weather-maps.json")
    .then(res => res.json())
    .then(data => {
      const last = data.radar.past[data.radar.past.length - 1];
      if (radarLayer) map.removeLayer(radarLayer);
      radarLayer = L.tileLayer(data.host + last.path + "/256/{z}/{x}/{y}/2/1_1.png",
        { opacity: 0.7, maxNativeZoom: 7, attribution: "RainViewer" }).addTo(map);
      document.getElementById("time").textContent = "เรดาร์เวลา "
        + new Date(last.time * 1000).toLocaleTimeString("th-TH");
    })
    .catch(() => { document.getElementById("time").textContent = "โหลดเรดาร์ไม่ได้"; });
}

function hourValue(base, h) {
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate(), h);
  if (d.getFullYear() !== YEAR) return undefined;
  const dayIndex = Math.round(
    (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(YEAR, 0, 1)) / 86400000);
  const c = station.d[dayIndex * 24 + d.getHours()];
  return c === undefined ? undefined : (AL.indexOf(c) - 5) / 10;
}

function fmt(t) {
  const total = Math.round(t * 60);
  return String(Math.floor(total / 60)).padStart(2, "0") + ":"
       + String(total % 60).padStart(2, "0");
}

function moveDay(n) { dayOffset += n; cursorT = null; loadTide(); }

function showCursor() {
  const el = document.getElementById("cursor");
  if (!levelAt) { el.textContent = ""; return; }
  const rising = levelAt(Math.min(24, cursorT + 0.02))
              >= levelAt(Math.max(0, cursorT - 0.02));
  el.textContent = fmt(cursorT) + " น.   " + levelAt(cursorT).toFixed(2)
                 + " ม. " + (rising ? "↑" : "↓");
}

function loadTide() {
  const list = document.getElementById("list");
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);
  document.getElementById("date").textContent =
    base.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" })
    + (dayOffset === 0 ? " (วันนี้)" : "");

  const arr = [];
  for (let h = -1; h <= 25; h++) arr.push(hourValue(base, h));

  if (tideChart) { tideChart.destroy(); tideChart = null; }
  if (arr[1] === undefined) {
    levelAt = null; showCursor();
    list.textContent = "แอปนี้มีข้อมูลเฉพาะปี 2569 (ค.ศ. 2026)";
    return;
  }
  for (let k = 2; k < arr.length; k++) if (arr[k] === undefined) arr[k] = arr[k - 1];
  if (arr[0] === undefined) arr[0] = arr[1];

  const slope = k => {
    const a = arr[k] - arr[k - 1], b = arr[k + 1] - arr[k];
    return a * b <= 0 ? 0 : 2 * a * b / (a + b);
  };
  levelAt = t => {
    const i = Math.min(23, Math.max(0, Math.floor(t)));
    const u = t - i, u2 = u * u, u3 = u2 * u;
    const p1 = arr[i + 1], p2 = arr[i + 2];
    return (2 * u3 - 3 * u2 + 1) * p1 + (u3 - 2 * u2 + u) * slope(i + 1)
         + (3 * u2 - 2 * u3) * p2 + (u3 - u2) * slope(i + 2);
  };

  const pts = [];
  for (let s = 0; s <= 288; s++) pts.push({ x: s / 12, y: levelAt(s / 12) });
  if (cursorT === null)
    cursorT = dayOffset === 0 ? now.getHours() + now.getMinutes() / 60 : 12;

  tideChart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { datasets: [{ data: pts, borderColor: "#5ec8ff",
      backgroundColor: "rgba(94,200,255,0.25)", pointRadius: 0, fill: true }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, events: [],
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: { type: "linear", min: 0, max: 24,
             ticks: { stepSize: 2, color: "white",
                      callback: v => String(v).padStart(2, "0") },
             grid: { color: "rgba(255,255,255,0.15)" } },
        y: { ticks: { color: "white", callback: v => v.toFixed(1) + " ม." },
             grid: { color: "rgba(255,255,255,0.15)" } }
      }
    },
    plugins: [{ id: "cursorLine", afterDraw(c) {
      const x = c.scales.x.getPixelForValue(cursorT);
      const a = c.chartArea, ctx = c.ctx;
      ctx.save();
      ctx.strokeStyle = "#ff4d4d"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, a.top); ctx.lineTo(x, a.bottom); ctx.stroke();
      ctx.restore();
    } }]
  });
  showCursor();

  let text = "", dir = 0, lastMove = 0;
  for (let m = 1; m <= 1440; m++) {
    const d = levelAt(m / 60) - levelAt((m - 1) / 60);
    const s = d > 1e-9 ? 1 : d < -1e-9 ? -1 : 0;
    if (s === 0) continue;
    if (dir !== 0 && s !== dir) {
      const t = Math.round((lastMove + m - 1) / 2) / 60;
      text += (dir === 1 ? "น้ำขึ้นเต็มที่ " : "น้ำลงเต็มที่ ")
            + levelAt(t).toFixed(1) + " ม. ราว " + fmt(t) + " น.\n";
    }
    dir = s; lastMove = m;
  }
  list.innerText = text || "วันนี้ไม่มีจุดกลับตัวของน้ำ";
}

const cv = document.getElementById("chart");
function drag(e) {
  if (!tideChart || !levelAt) return;
  const r = cv.getBoundingClientRect();
  const t = tideChart.scales.x.getValueForPixel(e.clientX - r.left);
  cursorT = Math.max(0, Math.min(24, t));
  tideChart.draw();
  showCursor();
}
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); drag(e); });
cv.addEventListener("pointermove", e => {
  if (e.buttons || e.pointerType === "touch") drag(e);
});

show("tide");
</script>
